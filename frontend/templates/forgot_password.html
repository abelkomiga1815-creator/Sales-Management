{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F5132">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" type="image/png" href="{% static 'images/icon-192x192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/icon-192x192.png' %}">
    <title>Shop Ledger - Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
    <main class="auth-panel">
        <h1 id="fpTitle">Reset Password</h1>
        <p id="fpDesc">Enter your username and we'll send you an OTP.</p>

        <!-- Step 1: Enter Username -->
        <form id="step1Form">
            {% csrf_token %}
            <div class="form-group">
                <label for="fpUsername">Username</label>
                <input class="form-input" id="fpUsername" name="username" type="text" required autocomplete="username">
            </div>
            <p class="auth-error" id="fpError1" role="alert"></p>
            <button class="btn btn-primary auth-submit" type="submit" id="sendOtpBtn">Send OTP</button>
        </form>

        <!-- Step 2: Enter OTP -->
        <form id="step2Form" hidden>
            <div class="form-group">
                <label for="otpInput">OTP Code</label>
                <input class="form-input" id="otpInput" name="otp" type="text" maxlength="6" pattern="[A-Za-z0-9]{6}" required placeholder="Enter 6-digit code" autocomplete="one-time-code">
            </div>
            <p class="auth-error" id="fpError2" role="alert"></p>
            <button class="btn btn-primary auth-submit" type="submit" id="verifyOtpBtn">Verify OTP</button>
        </form>

        <!-- Step 3: Set New Password -->
        <form id="step3Form" hidden>
            <div class="form-group">
                <label for="newPasswordInput">New Password</label>
                <input class="form-input" id="newPasswordInput" name="new_password" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="password-strength-container" id="fpStrengthContainer" hidden>
                <div class="password-strength-bar">
                    <div class="password-strength-fill" id="fpStrengthFill"></div>
                </div>
                <span class="password-strength-label" id="fpStrengthLabel"></span>
                <ul class="password-checklist" id="fpChecklist">
                    <li data-check="length">At least 8 characters</li>
                    <li data-check="upper">One uppercase letter</li>
                    <li data-check="lower">One lowercase letter</li>
                    <li data-check="number">One number</li>
                    <li data-check="special">One special character</li>
                </ul>
            </div>
            <div class="form-group">
                <label for="confirmPasswordInput">Confirm Password</label>
                <input class="form-input" id="confirmPasswordInput" name="confirm_password" type="password" required autocomplete="new-password">
            </div>
            <p class="auth-error" id="fpError3" role="alert"></p>
            <button class="btn btn-primary auth-submit" type="submit" id="resetPwBtn">Reset Password</button>
        </form>

        <a id="fpBackLink" href="/login/">Back to Login</a>
    </main>
    <script>
        const isRegister = false;
        const csrfToken = () => document.querySelector('[name=csrfmiddlewaretoken]').value;

        let resetUsername = '';
        let resetToken = '';

        const step1Form = document.getElementById('step1Form');
        const step2Form = document.getElementById('step2Form');
        const step3Form = document.getElementById('step3Form');
        const fpError1 = document.getElementById('fpError1');
        const fpError2 = document.getElementById('fpError2');
        const fpError3 = document.getElementById('fpError3');
        const fpTitle = document.getElementById('fpTitle');
        const fpDesc = document.getElementById('fpDesc');

        step1Form.addEventListener('submit', async (e) => {
            e.preventDefault();
            fpError1.textContent = '';
            resetUsername = document.getElementById('fpUsername').value.trim();
            if (!resetUsername) { fpError1.textContent = 'Username is required.'; return; }

            const resp = await fetch('/api/auth/forgot-password/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
                body: JSON.stringify({username: resetUsername}),
            });
            const data = await resp.json();
            fpError1.textContent = data.error || '';
            if (resp.ok) {
                fpTitle.textContent = 'Verify OTP';
                fpDesc.textContent = 'Enter the 6-digit code sent to your email.';
                step1Form.hidden = true;
                step2Form.hidden = false;
                document.getElementById('otpInput').focus();
            }
        });

        step2Form.addEventListener('submit', async (e) => {
            e.preventDefault();
            fpError2.textContent = '';
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) { fpError2.textContent = 'OTP is required.'; return; }

            const resp = await fetch('/api/auth/verify-otp/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
                body: JSON.stringify({username: resetUsername, otp}),
            });
            const data = await resp.json();
            if (resp.ok) {
                resetToken = data.reset_token;
                fpTitle.textContent = 'Set New Password';
                fpDesc.textContent = 'Enter your new password below.';
                step2Form.hidden = true;
                step3Form.hidden = false;
                document.getElementById('fpStrengthContainer').hidden = false;
                document.getElementById('newPasswordInput').focus();
            } else {
                fpError2.textContent = data.error || 'Invalid OTP.';
            }
        });

        step3Form.addEventListener('submit', async (e) => {
            e.preventDefault();
            fpError3.textContent = '';
            const pw = document.getElementById('newPasswordInput').value;
            const cpw = document.getElementById('confirmPasswordInput').value;

            if (pw !== cpw) { fpError3.textContent = 'Passwords do not match.'; return; }

            const resp = await fetch('/api/auth/reset-password/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
                body: JSON.stringify({username: resetUsername, new_password: pw, reset_token: resetToken}),
            });
            const data = await resp.json();
            if (resp.ok) {
                fpTitle.textContent = 'Success!';
                fpDesc.textContent = data.message;
                step3Form.hidden = true;
                document.getElementById('fpStrengthContainer').hidden = true;
            } else {
                fpError3.textContent = Array.isArray(data.error) ? data.error.join(' ') : (data.error || 'Failed to reset password.');
            }
        });

        // Password strength indicator for step 3
        const fpNewPw = document.getElementById('newPasswordInput');
        const fpFill = document.getElementById('fpStrengthFill');
        const fpLabel = document.getElementById('fpStrengthLabel');
        const fpChecklist = document.getElementById('fpChecklist');

        fpNewPw.addEventListener('input', () => {
            const val = fpNewPw.value;
            const checks = {
                length: val.length >= 8,
                upper: /[A-Z]/.test(val),
                lower: /[a-z]/.test(val),
                number: /[0-9]/.test(val),
                special: /[^A-Za-z0-9]/.test(val),
            };
            const passed = Object.values(checks).filter(Boolean).length;
            fpChecklist.querySelectorAll('li').forEach(li => {
                const key = li.dataset.check;
                li.classList.toggle('passed', checks[key]);
            });
            let score = 0, label = '', color = '';
            if (passed <= 2) { score = 33; label = 'Weak'; color = '#D32F2F'; }
            else if (passed <= 4) { score = 66; label = 'Medium'; color = '#FFA500'; }
            else { score = 100; label = 'Strong'; color = '#388E3C'; }
            fpFill.style.width = score + '%';
            fpFill.style.backgroundColor = color;
            fpLabel.textContent = label;
            fpLabel.style.color = color;
        });
    </script>
</body>
</html>
