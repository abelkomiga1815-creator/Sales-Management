version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shop_ledger_db
    environment:
      POSTGRES_DB: ${DB_NAME:-shop_ledger_db}
      POSTGRES_USER: ${DB_USER:-shop_ledger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop_ledger_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shop_ledger_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: shop_ledger_web
    working_dir: /app/backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DB_NAME: ${DB_NAME:-shop_ledger_db}
      DB_USER: ${DB_USER:-shop_ledger_user}
      DB_PASSWORD: ${DB_PASSWORD:-shop_ledger_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
